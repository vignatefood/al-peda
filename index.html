<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">

<style>
:root{--bg:#0e2619;--card:#16382a;--gold:#d9b36c;--cream:#f3e6c4;--mut:#a9b8a5;--red:#d96c6c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--cream);font:16px Georgia,'Times New Roman',serif;padding-bottom:84px}
header{text-align:center;padding:16px 12px 8px;border-bottom:2px solid var(--gold)}
header h1{margin:0;color:var(--gold);font-size:22px;letter-spacing:1px}header small{color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button,.btn{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:8px 14px;font:inherit;white-space:nowrap;cursor:pointer}
nav button.on,.btn.p{background:var(--gold);color:#10281c;font-weight:bold}
.btn:disabled,.btn[disabled]{opacity:.4;cursor:not-allowed}
main{max-width:720px;margin:0 auto;padding:0 12px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid #2c5a45;border-radius:10px;padding:10px;margin:8px 0;cursor:pointer}
.item img{width:64px;height:64px;object-fit:cover;border-radius:8px}.item .t{flex:1}.item b{display:block}
.item span{color:var(--mut);font-size:13px}.pr{color:var(--gold);font-weight:bold;white-space:nowrap}.out{opacity:.45}
.note{color:var(--mut);font-style:italic;text-align:center}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}.sheet.show{display:flex}
.sheet>div{background:var(--bg);border-top:2px solid var(--gold);width:100%;max-width:720px;margin:0 auto;max-height:88%;overflow:auto;padding:16px;border-radius:16px 16px 0 0}
label.o{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dotted #2c5a45}
input,select,textarea{width:100%;background:#0b1d14;color:var(--cream);border:1px solid #2c5a45;border-radius:8px;padding:10px;font:inherit;margin:4px 0}
input[type=checkbox],input[type=radio]{width:auto}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#0b1d14;border-top:2px solid var(--gold);display:flex;justify-content:space-between;align-items:center;z-index:10}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.ord{background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:12px}.ord h3{margin:0 0 6px;color:var(--gold)}
.ord.n{border-color:var(--red);border-width:2px}.ord li{margin:4px 0}.rm{color:var(--red)}.ad{color:#8fd19e}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.warn{background:#3a2a10;border:1px solid var(--gold);padding:8px;border-radius:8px;font-size:13px;margin:8px 0}
</style></head><body>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>'€'+Number(n).toFixed(2).replace('.',',');
const CATS=['Piatti','Stuzzichini','Birre alla spina','Birre in bottiglia','Cocktail','Gin Premium','Vini'];
// [cat,nome,descrizione,[[formato,prezzo]...]]
const SEED=[
['Gin Premium','Tanqueray','',[['',8]]],['Gin Premium','Mare','',[['',11]]],['Gin Premium',"Hendrick's",'',[['',11]]],['Gin Premium','Nordes','',[['',11]]],['Gin Premium','Malfy Pompelmo Rosa','',[['',11]]],
['Birre alla spina','1897 Non Filtrata','5,8%',[['0,20 lt',3.5],['0,40 lt',6],['1 lt',11]]],

['Birre alla spina','Guinness','4,2%',[['0,20 lt',4],['0,40 lt',6.5]]],
['Birre alla spina','Leffe Rouge','6,6%',[['0,20 lt',4],['0,40 lt',7],['1 lt',13]]],
['Birre in bottiglia','Superior senza glutine','33cl 5,2%',[['',5]]],['Birre in bottiglia','Pedavena Tradizionale','33cl 5,0%',[['',4]]],
['Birre in bottiglia','Pedavena Ambrata','33cl 5,9%',[['',4.5]]],['Birre in bottiglia','Dolomiti Non Filtrata','33cl 5,8%',[['',4.5]]],
['Birre in bottiglia','Superior Analcolica','33cl <0,5%',[['',4]]],['Birre in bottiglia','Dolomiti 8°','33cl 8%',[['',5]]],
['Birre in bottiglia','Dolomiti Rossa','75cl 6,7%',[['',9]]],['Birre in bottiglia','Dolomiti La Speciale','75cl 5,9%',[['',9]]],
['Cocktail','Campari Spritz','Bitter rosso, prosecco, soda',[['',6]]],['Cocktail','Negroni','Bitter rosso, vermouth rosso, gin',[['',7]]],
['Cocktail','Negroni Sbagliato','Bitter rosso, vermouth rosso, spumante brut',[['',7]]],['Cocktail','Americano','Bitter rosso, vermouth rosso, soda',[['',7]]],
['Cocktail','Whisky Sour','Whisky, sweet and sour',[['',9]]],['Cocktail','Capiroska','Vodka dry, lime, zucchero',[['',8]]],['Cocktail','Caipiriña','Cachaça, lime, zucchero',[['',8]]],
['Cocktail','Moscow Mule','Vodka, ginger beer, succo di lime',[['',8]]],['Cocktail','Mojito','Rum, lime, zucchero, foglie di menta',[['',8]]],
['Cocktail','Sex on the beach','Vodka, liquore alla pesca, succo d’arancia, cranberry',[['',7]]],['Cocktail','Cosmopolitan','Vodka, triple sec, cranberry, succo di lime',[['',9]]],
['Cocktail','Daiquiri','Rum chiaro, succo di limone, zucchero',[['',9]]],['Cocktail','Old Fashioned','Bourbon, zolletta di zucchero con angostura',[['',10]]],
['Cocktail','Vodka Sour','Vodka, succo di limone, zucchero',[['',8]]],['Cocktail','Tequila Sunrise','Tequila, succo d’arancia, granatina',[['',8]]],
['Cocktail','Cuba Libre','Rum scuro, lime',[['',8]]],['Cocktail','Vodka tonic lemon','',[['',7]]],['Cocktail','Vodka Red Bull','',[['',8]]],['Cocktail','Gin Bosford tonic lemon','',[['',8]]],
['Vini','Falanghina','Bianco',[['Calice',4],['Bottiglia',20]]],['Vini','Greco','Bianco',[['Calice',6],['Bottiglia',30]]],['Vini','Gewurztraminer','Bianco',[['Calice',6],['Bottiglia',29]]],
['Vini','Lugana','Bianco',[['Calice',6],['Bottiglia',29]]],['Vini','Primitivo','Rosso',[['Calice',4],['Bottiglia',24]]],['Vini','Ripasso','Rosso',[['Calice',6],['Bottiglia',30]]],
['Vini','Chianti','Rosso',[['Calice',5],['Bottiglia',29]]],['Vini','Prosecco','',[['Calice',5],['Bottiglia',22]]],
['Stuzzichini','Patate fritte con buccia','',[['',5.5]]],['Stuzzichini','Anelli di cipolla in pastella','Allergeni: 1',[['',6]]],['Stuzzichini','Mozzarella stick 7pz','Allergeni: 1,7',[['',6.5]]],
['Stuzzichini','Tender di pollo 7pz','Allergeni: 3',[['',6.5]]],['Stuzzichini','Olive all’ascolana 7pz','Allergeni: 1,2,3,4,6,7,10,14',[['',5.5]]],
['Stuzzichini','Bouquet di arrosticini di pecora pz10','',[['',10]]],['Stuzzichini','Assaggio di salumi con sottoli e uva','Allergeni: 7,8',[['',5]]],
['Stuzzichini','Assaggio di formaggi con marmellata, noci e uva','Allergeni: 7,8',[['',5]]],['Stuzzichini','Peda Bucket 2/4 pers.','Mix dei nostri stuzzichini · Allergeni: 1,2,3,4,6,7,10,14',[['',20]]]
].map((r,i)=>({id:'s'+i,cat:r[0],name:r[1],desc:r[2],prices:r[3],out:false,img:'',rem:[],add:[]}));


// ---- Archivio: menù salvato sul dispositivo (in attesa di GitHub)
const ST={menu:{},url:'',L:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},S:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const subs=[];const fire=()=>subs.forEach(f=>f());
const PWD='peda2027'; // password provvisoria: da cambiare prima della pubblicazione
let auth=false,authC=true; // cameriera senza password; admin con password
function initStore(){ST.menu=Object.fromEntries(SEED.map(i=>[i.id,i]));Object.assign(ST.menu,ST.L('pm',{}));Object.keys(ST.menu).forEach(k=>ST.menu[k].deleted&&delete ST.menu[k]);ST.url=ST.L('pu','');$('#sub').textContent='Ordina dal tuo tavolo';fire()}
function saveItem(it){ST.menu[it.id]=it;const m=ST.L('pm',{});m[it.id]=it;ST.S('pm',m);fire()}
function delItem(id){delete ST.menu[id];const m=ST.L('pm',{});m[id]={deleted:true};ST.S('pm',m);fire()}
function saveUrl(u){ST.url=u;ST.S('pu',u);fire()}

// ---- Router
let cart=[],cat=CATS[1];const tavolo=()=>{const m=/^tavolo-(\d+)$/.exec(location.hash.slice(1));return m?m[1]:''};
const view=()=>{const h=(location.hash||'#cliente').slice(1);return h.startsWith('tavolo-')?'cliente':h};
function render(){stopScan();const v=view();if(v!=='admin')auth=false;$('#app').innerHTML='';
 const nav=`<div class="note" style="margin:8px"><a class="btn" href="#cliente">Menù</a> <a class="btn" href="#cameriera">Cameriera</a> <a class="btn" href="#admin">Gestione</a></div>`;
 if(v==='admin')admin();else if(v==='cameriera')cameriera();else cliente();
 $('#app').insertAdjacentHTML('beforeend',nav);}
subs.push(render);addEventListener('hashchange',render);
const items=()=>Object.values(ST.menu).filter(i=>!i.deleted);
const fmtP=i=>i.prices.length>1?'da '+eur(Math.min(...i.prices.map(p=>p[1]))):eur(i.prices[0][1]);
function closeSh(){$('#sh').classList.remove('show')}$('#sh').onclick=e=>{if(e.target.id==='sh')closeSh()};
function openSh(h){$('#shc').innerHTML=h;$('#sh').classList.add('show')}

// ---- Cliente
function cliente(){const list=items().filter(i=>i.cat===cat);
 const cats=[...new Set([...CATS,...items().map(i=>i.cat)])];
 const tot=cart.reduce((s,c)=>s+c.unit*c.q,0),n=cart.reduce((s,c)=>s+c.q,0);
 $('#app').innerHTML=`<nav>${cats.map(c=>`<button class="${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</nav><main>
 ${tavolo()?'<p class="note">Sei al tavolo '+esc(tavolo())+'</p>':''}
 ${ST.L('ult',null)?'<div class="row" style="justify-content:center"><button class="btn" id="ul">Rivedi il QR del tuo ultimo ordine</button></div>':''}
 ${cat==='Gin Premium'?'<p class="note">Tutti i gin vengono serviti con toniche premium.</p>':''}
 ${list.length?list.map(i=>`<div class="item ${i.out?'out':''}" data-i="${i.id}">${i.img?`<img src="${i.img}" alt="">`:''}<div class="t"><b>${esc(i.name)}</b><span>${esc(i.desc)}</span></div><div class="pr">${i.out?'Terminato':fmtP(i)}</div></div>`).join(''):'<p class="note">Nessun piatto in questa categoria, per ora.</p>'}
 </main><div class="bar"><span>${n} ${n===1?'articolo':'articoli'} · <b class="pr">${eur(tot)}</b></span><button class="btn p" id="go" ${n?'':'disabled'}>Vedi ordine</button></div>`;
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;render()});
 document.querySelectorAll('.item').forEach(e=>e.onclick=()=>{const i=ST.menu[e.dataset.i];if(!i.out)pick(i)});
 $('#go').onclick=checkout;if($('#ul'))$('#ul').onclick=()=>showOrdQR(ST.L('ult',null));}
function pick(i){openSh(`<h2 style="color:var(--gold);margin-top:0">${esc(i.name)}</h2>${i.img?`<img src="${i.img}" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px">`:''}<p class="note">${esc(i.desc)}</p>
 ${i.prices.length>1?i.prices.map((p,k)=>`<label class="o"><span><input type="radio" name="pz" value="${k}" ${k?'':'checked'}> ${esc(p[0])}</span><b>${eur(p[1])}</b></label>`).join(''):''}
 ${i.rem.length?'<h4>Togli</h4>'+i.rem.map(r=>`<label class="o"><span><input type="checkbox" class="rm" value="${esc(r)}"> Senza ${esc(r)}</span></label>`).join(''):''}
 ${i.add.length?'<h4>Aggiungi</h4>'+i.add.map(a=>`<label class="o"><span><input type="checkbox" class="ad" value="${esc(a[0])}|${a[1]}"> ${esc(a[0])}</span><b>+${eur(a[1])}</b></label>`).join(''):''}
 <input id="nt" placeholder="Note (facoltativo)"><div class="row"><button class="btn" id="mn">−</button><b id="qq" style="padding:8px">1</b><button class="btn" id="pl">+</button><button class="btn p" id="ok" style="flex:1">Aggiungi</button></div>`);
 let q=1;$('#mn').onclick=()=>{q=Math.max(1,q-1);$('#qq').textContent=q};$('#pl').onclick=()=>{q++;$('#qq').textContent=q};
 $('#ok').onclick=()=>{const k=+(document.querySelector('input[name=pz]:checked')?.value||0),p=i.prices[k];
  const rem=[...document.querySelectorAll('.rm:checked')].map(x=>x.value),add=[...document.querySelectorAll('.ad:checked')].map(x=>x.value.split('|'));
  cart.push({n:i.name+(p[0]?' ('+p[0]+')':''),q,unit:p[1]+add.reduce((s,a)=>s+ +a[1],0),rem,add:add.map(a=>a[0]),note:$('#nt').value.trim()});closeSh();render()}}
function checkout(){openSh(`<h2 style="color:var(--gold);margin-top:0">Il tuo ordine</h2>${cart.map((c,k)=>`<label class="o"><span>${c.q}× ${esc(c.n)}<br><small class="note">${[...c.rem.map(r=>'senza '+r),...c.add.map(a=>'+ '+a),c.note].filter(Boolean).map(esc).join(', ')}</small></span><span><b>${eur(c.unit*c.q)}</b> <button class="btn" data-x="${k}">✕</button></span></label>`).join('')}
 <select id="tv"><option value="">Numero del tavolo…</option>${Array.from({length:Math.max(30,+tavolo()||0)},(_,k)=>`<option ${tavolo()==k+1?'selected':''}>${k+1}</option>`).join('')}<option>Banco</option></select><input id="nm" placeholder="Il tuo nome (facoltativo)">
 <div class="row"><button class="btn" id="cl">Chiudi</button><button class="btn p" id="inv" style="flex:1">Conferma ordine</button></div>`);
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=e=>{e.stopPropagation();cart.splice(+b.dataset.x,1);cart.length?checkout():closeSh();render()});
 $('#cl').onclick=closeSh;$('#inv').onclick=()=>{const t=$('#tv').value;if(!t)return alert('Scegli il numero del tavolo.');
  const o={id:'o'+Date.now(),t,nm:$('#nm').value.trim(),ts:Date.now(),lines:cart};
  ST.S('ult',o);cart=[];showOrdQR(o);render()}}


// ---- QR dell'ordine (cliente) e lettura (cameriera)
const asc=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[^\x00-\x7F]/g,'');
function orderText(o){const tot=o.lines.reduce((s,l)=>s+l.unit*l.q,0);
 return asc('AL PEDA - TAVOLO '+o.t+(o.nm?' ('+o.nm+')':'')+'\n'+o.lines.map(l=>{const m=[...l.rem.map(r=>'senza '+r),...l.add.map(a=>'+ '+a),l.note].filter(Boolean);return l.q+'x '+l.n+(m.length?' - '+m.join(', '):'')}).join('\n')+(tot?'\nTOT EUR '+tot.toFixed(2).replace('.',','):''))}
function showOrdQR(o){const t=orderText(o);
 openSh('<h2 style="color:var(--gold);margin-top:0">Il tuo ordine 🍺</h2><p>Resta sul tuo telefono. Quando passa la cameriera, mostrale questo QR: lo inquadra e legge l’ordine.</p><div style="text-align:center"><div id="oq" style="background:#fff;padding:10px;display:inline-block"></div></div><pre style="white-space:pre-wrap;font:inherit;font-size:14px;margin:10px 0">'+esc(t)+'</pre><button class="btn p" onclick="closeSh()">Ok</button>');
 try{new QRCode($('#oq'),{text:t,width:280,height:280,correctLevel:QRCode.CorrectLevel.L})}catch(e){$('#oq').textContent='Ordine troppo lungo per il QR: mostra il testo alla cameriera.'}}
function lista(){return ST.L('lista',[])}
function addOrd(t){const l=lista(),m=$('#cm');if(l.includes(t)){if(m)m.textContent='Ordine già in lista.';return}l.push(t);ST.S('lista',l);if(m)m.textContent='Ordine aggiunto ✔ ('+l.length+' in lista)';drawLst()}
function drawLst(){const b=$('#lst');if(!b)return;const l=lista();b.innerHTML=l.length?l.map((t,k)=>'<div class="ord" style="margin:8px 0"><pre style="white-space:pre-wrap;font:inherit;margin:0">'+esc(t)+'</pre><div class="row"><button class="btn p" data-ev="'+k+'">Evaso</button></div></div>').join(''):'<p class="note">Nessun ordine in lista.</p>';
 b.querySelectorAll('[data-ev]').forEach(x=>x.onclick=()=>{const a=lista();a.splice(+x.dataset.ev,1);ST.S('lista',a);drawLst()})}
let cam=null,raf=0,scanBusy=false,scanTm=0;
function stopScan(){cancelAnimationFrame(raf);raf=0;clearTimeout(scanTm);if(cam){cam.getTracks().forEach(t=>t.stop());cam=null}const v=$('#vd');if(v){try{v.srcObject=null}catch(e){}}}
function cameriera(){
 $('#app').innerHTML='<main><h2 style="color:var(--gold)">Lettura ordine</h2><div class="item" style="display:block;cursor:default"><p class="note" id="cm">Inquadra il QR del cliente.</p><video id="vd" playsinline muted autoplay style="width:100%;border-radius:10px;background:#000"></video><div class="row"><button class="btn p" id="cs">Scansiona di nuovo</button><label class="btn">📷 Leggi da foto<input type="file" id="cf" accept="image/*" capture="environment" style="display:none"></label></div></div><h3 style="color:var(--gold)">Ordini ricevuti</h3><div id="lst"></div><div class="item" style="display:block;cursor:default"><span>Se la fotocamera non parte, incolla qui il testo:</span><textarea id="mt" rows="3"></textarea><div class="row"><button class="btn" id="ma">Aggiungi testo</button></div></div></main>';
 $('#cs').onclick=startScan;$('#cf').onchange=e=>{const f=e.target.files[0];if(!f)return;const m=$('#cm');m.textContent='Lettura in corso…';const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1200/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),r=typeof jsQR!=='undefined'?jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'}):null;if(r&&r.data){addOrd(r.data)}else{m.textContent='QR non trovato: riprova avvicinandoti, tenendo il QR ben dritto e ben illuminato (senza riflessi).';const ta=$('#mt');if(ta){ta.value='';ta.placeholder='Incolla qui il testo dell\'ordine come fallback…'}}URL.revokeObjectURL(im.src);e.target.value=''};im.onerror=()=>{m.textContent='Impossibile leggere la foto. Riprova o incolla il testo qui sotto.'};im.src=URL.createObjectURL(f)};$('#ma').onclick=()=>{const v=$('#mt').value.trim();if(v){addOrd(v);$('#mt').value=''}};drawLst();startScan()}
function startScan(){
 if(scanBusy){return}
 stopScan();
 const m=$('#cm');if(!m){scanBusy=false;return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){m.textContent='Errore: fotocamera non supportata. Apri l\'app su HTTPS (non su file://) oppure usa il campo testo qui sotto.';return}
 if(typeof jsQR==='undefined'||window.__jsQRFailed){m.textContent='Errore: lettore QR (jsQR) non caricato. Verifica la connessione internet, ricarica la pagina, oppure usa il campo testo qui sotto.';return}
 if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){m.textContent='Attenzione: la fotocamera richiede HTTPS. Apri l\'app dall\'indirizzo pubblico https://… ; nel frattempo puoi leggere da foto o incollare il testo qui sotto.';return}
 scanBusy=true;
 m.textContent='Avvio fotocamera…';
 const tryGet=(cons,fallback)=>{
  navigator.mediaDevices.getUserMedia(cons).then(s=>{
   const v=$('#vd');
   if(!v){s.getTracks().forEach(t=>t.stop());scanBusy=false;return}
   cam=s;v.srcObject=s;
   const ready=()=>{scanBusy=false;clearTimeout(scanTm);m.textContent='Inquadra il QR del cliente (puoi anche avvicinarti).';startLoop(v)};
   if(v.readyState>=2){ready()}else{v.onloadedmetadata=ready}
   v.play().catch(()=>{});
   scanTm=setTimeout(()=>{if(!cam){scanBusy=false;m.textContent='La fotocamera non risponde. Verifica i permessi, chiudi le altre app che la usano, oppure usa il campo testo qui sotto.'}},8000);
  }).catch(er=>{
   if(fallback){tryGet(fallback,null);return}
   scanBusy=false;
   const name=er&&er.name||'?';
   let msg='Errore fotocamera: '+name+(er&&er.message?' – '+er.message:'')+'. ';
   if(name==='NotAllowedError'||name==='PermissionDeniedError')msg+='Consenti l\'accesso alla fotocamera nelle impostazioni del browser. ';
   else if(name==='NotFoundError'||name==='DevicesNotFoundError')msg+='Nessuna fotocamera trovata sul dispositivo. ';
   else if(name==='NotReadableError'||name==='TrackStartError')msg+='La fotocamera è occupata da un\'altra app: chiudila e riprova. ';
   msg+='Nel frattempo puoi leggere da foto o incollare il testo qui sotto.';
   m.textContent=msg;
  });
 };
 tryGet({video:{facingMode:{ideal:'environment'}}},{video:true});
}
function startLoop(v){
 cancelAnimationFrame(raf);raf=0;
 const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
 const SW=480;
 (function loop(){
  if(!cam){return}
  if(v.videoWidth>0){
   const sc=SW/Math.max(v.videoWidth,v.videoHeight);
   c.width=Math.max(1,Math.round(v.videoWidth*sc));
   c.height=Math.max(1,Math.round(v.videoHeight*sc));
   x.drawImage(v,0,0,c.width,c.height);
   const d=x.getImageData(0,0,c.width,c.height);
   const r=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
   if(r&&r.data){
    addOrd(r.data);
    if(navigator.vibrate)navigator.vibrate(150);
    cancelAnimationFrame(raf);raf=0;
    setTimeout(()=>{if(cam&&$('#vd')===v){startLoop(v)}},1500);
    return;
   }
  }
  raf=requestAnimationFrame(loop);
 })();
}

// ---- Editor foto: riquadro quadrato fisso, tutte le foto escono 480x480
function cropFoto(im,done){const V=280;let z=1,ox=0,oy=0;
 const base=Math.max(V/im.width,V/im.height);
 const lim=()=>{const w=im.width*base*z,h=im.height*base*z;ox=Math.min(0,Math.max(V-w,ox));oy=Math.min(0,Math.max(V-h,oy))};
 const sh=document.createElement('div');sh.className='sheet show';sh.style.zIndex=40;
 sh.innerHTML='<div><h3 style="margin-top:0;color:var(--gold)">Sistema la foto</h3><p class="note">Trascina la foto e usa lo zoom: nel menù vedrai esattamente il quadrato qui sotto.</p><div style="text-align:center"><canvas id="cv" width="'+V+'" height="'+V+'" style="width:'+V+'px;height:'+V+'px;border:2px solid var(--gold);border-radius:8px;touch-action:none;background:#000"></canvas></div><input type="range" id="zm" min="1" max="4" step="0.01" value="1"><div class="row"><button class="btn p" id="cok" style="flex:1">Usa questa foto</button><button class="btn" id="cno">Annulla</button></div></div>';
 document.body.appendChild(sh);
 const cv=sh.querySelector('#cv'),x=cv.getContext('2d');
 const draw=()=>{lim();x.fillStyle='#000';x.fillRect(0,0,V,V);x.drawImage(im,ox,oy,im.width*base*z,im.height*base*z)};
 ox=(V-im.width*base)/2;oy=(V-im.height*base)/2;draw();
 let dr=null;
 cv.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!dr)return;ox=dr.ox+(e.clientX-dr.x);oy=dr.oy+(e.clientY-dr.y);draw()};
 cv.onpointerup=cv.onpointercancel=()=>{dr=null};
 sh.querySelector('#zm').oninput=e=>{const n=+e.target.value,c=V/2,k=n/z;ox=c-(c-ox)*k;oy=c-(c-oy)*k;z=n;draw()};
 sh.querySelector('#cno').onclick=()=>sh.remove();
 sh.querySelector('#cok').onclick=()=>{lim();const o=document.createElement('canvas');o.width=o.height=480;const k=480/V;
  o.getContext('2d').drawImage(im,ox*k,oy*k,im.width*base*z*k,im.height*base*z*k);done(o.toDataURL('image/jpeg',.8));sh.remove()}}

// ---- Gestione (con password)
function admin(){
 if(!auth){$('#app').innerHTML='<main><h2 style="color:var(--gold)">Gestione</h2><div class="item" style="display:block;cursor:default"><input id="pw" type="password" placeholder="Password"><div class="row"><button class="btn p" id="pk">Entra</button></div></div></main>';
  $('#pk').onclick=()=>{if($('#pw').value===PWD){auth=true;render()}else alert('Password errata.')};return}
 const l=items().sort((a,b)=>a.cat.localeCompare(b.cat));
 $('#app').innerHTML=`<main><h2 style="color:var(--gold)">Gestione menù</h2>
 <div class="item" style="display:block;cursor:default"><b>QR unico del locale</b><span>Indirizzo dell'app (quello definitivo, online)</span>
 <input id="au" placeholder="https://..." value="${esc(ST.url)}"><div class="row"><button class="btn" id="aus">Salva e mostra QR</button><button class="btn" id="aom">Ordine a mano</button></div><div id="qrs" style="text-align:center;margin-top:10px"></div></div>
 <button class="btn p" id="new">+ Nuovo piatto / prodotto</button>
 ${l.map(i=>`<div class="item" data-e="${i.id}"><div class="t"><b>${esc(i.name)}</b><span>${esc(i.cat)}</span></div><div class="pr">${i.out?'Terminato':fmtP(i)}</div></div>`).join('')}</main>`;
 $('#new').onclick=()=>edit({id:'n'+Date.now(),cat:'Piatti',name:'',desc:'',prices:[['',0]],out:false,img:'',rem:[],add:[]});
 document.querySelectorAll('[data-e]').forEach(e=>e.onclick=()=>edit(ST.menu[e.dataset.e]));
 $('#aus').onclick=()=>{saveUrl($('#au').value.trim());drawQR()};$('#aom').onclick=manuale;drawQR();}
function drawQR(){const box=$('#qrs');if(!box)return;box.innerHTML='';
 if(!/^https?:\/\//.test(ST.url)){box.innerHTML='<p class="note">Inserisci e salva l’indirizzo dell’app (deve iniziare con https://).</p>';return}
 box.innerHTML='<div id="qq1" style="background:#fff;padding:10px;display:inline-block"></div><p class="note">Un solo QR per tutti i tavoli: stampalo o fai uno screenshot.</p>';
 try{new QRCode($('#qq1'),{text:ST.url.split('#')[0],width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}catch(e){box.innerHTML='<p class="note">Indirizzo troppo lungo per il QR. Usa un URL breve.</p>'}}
function manuale(){openSh(`<h3 style="margin-top:0;color:var(--gold)">Ordine a mano</h3><input id="mt1" placeholder="Tavolo"><textarea id="mt2" rows="5" placeholder="Una riga per articolo, es. 2x Guinness 0,40 lt"></textarea><div class="row"><button class="btn p" id="mo" style="flex:1">Genera ordine</button><button class="btn" id="mx">Chiudi</button></div>`);
 $('#mx').onclick=closeSh;$('#mo').onclick=()=>{const t=$('#mt1').value.trim()||'?',r=$('#mt2').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!r.length)return;
  showOrdQR({id:'m'+Date.now(),t,nm:'',lines:r.map(x=>{const m=/^(\d+)\s*x?\s*(.+)$/i.exec(x);return{q:m?+m[1]:1,n:m?m[2]:x,unit:0,rem:[],add:[],note:''}})})}}
function edit(i){let img=i.img;const cs=[...new Set([...CATS,...items().map(x=>x.cat)])];
 openSh(`<h3 style="margin-top:0;color:var(--gold)">${i.name?'Modifica':'Nuovo'}</h3>
 <select id="ec">${cs.map(c=>`<option ${c===i.cat?'selected':''}>${esc(c)}</option>`).join('')}<option value="_">+ Nuova categoria…</option></select><input id="ecn" placeholder="Nome nuova categoria" style="display:none">
 <input id="en" placeholder="Nome" value="${esc(i.name)}"><textarea id="ed" rows="2" placeholder="Descrizione / allergeni">${esc(i.desc)}</textarea>
 <textarea id="ep" rows="2" placeholder="Prezzi, uno per riga: formato=prezzo (es. 0,40 lt=6,50) oppure solo il prezzo">${esc(i.prices.map(p=>(p[0]?p[0]+'=':'')+String(p[1]).replace('.',',')).join('\n'))}</textarea>
 <input id="er" placeholder="Ingredienti che si possono togliere (separati da virgola)" value="${esc(i.rem.join(', '))}">
 <textarea id="ea" rows="2" placeholder="Extra: nome=prezzo, uno per riga (es. Mozzarella=1,50)">${esc(i.add.map(a=>a[0]+'='+String(a[1]).replace('.',',')).join('\n'))}</textarea>
 <img id="ep2" src="${esc(i.img)}" style="width:96px;height:96px;object-fit:cover;border-radius:8px;display:${i.img?'block':'none'};margin:6px 0"><input type="file" id="ef" accept="image/*"><label class="o"><span><input type="checkbox" id="eo" ${i.out?'checked':''}> Terminato</span></label>
 <div class="row"><button class="btn p" id="es" style="flex:1">Salva</button><button class="btn" id="ex">Annulla</button>${i.name?'<button class="btn" id="edl">Elimina</button>':''}</div>`);
 $('#ec').onchange=e=>$('#ecn').style.display=e.target.value==='_'?'block':'none';
 $('#ef').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>cropFoto(im,d=>{img=d;const p=$('#ep2');if(p){p.src=d;p.style.display='block'}});im.src=r.result};r.readAsDataURL(f);e.target.value=''};
 const num=s=>parseFloat(String(s).replace(',','.'))||0;
 $('#es').onclick=()=>{const nm=$('#en').value.trim();if(!nm)return alert('Inserisci il nome.');
  const prices=$('#ep').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const k=x.lastIndexOf('=');return k<0?['',num(x)]:[x.slice(0,k).trim(),num(x.slice(k+1))]});
  const add=$('#ea').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const k=x.lastIndexOf('=');return [x.slice(0,k).trim(),num(x.slice(k+1))]});
  saveItem({id:i.id,cat:$('#ec').value==='_'?($('#ecn').value.trim()||'Altro'):$('#ec').value,name:nm,desc:$('#ed').value.trim(),prices:prices.length?prices:[['',0]],out:$('#eo').checked,img,rem:$('#er').value.split(',').map(x=>x.trim()).filter(Boolean),add});closeSh()};
 $('#ex').onclick=closeSh;if($('#edl'))$('#edl').onclick=()=>{if(confirm('Eliminare?')){delItem(i.id);closeSh()}}}
initStore();render();
</script></body></html>
