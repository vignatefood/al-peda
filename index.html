// ---- Archivio: menù locale + sync remoto (GitHub Pages)
// 'pm' = piatti modificati dal gestore (localStorage)
// 'rm' = URL remoto del menu.json (GitHub Pages)
// 'rv' = timestamp ultimo menu.json remoto scaricato
const ST={menu:{},url:'',rurl:'',L:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},S:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){return false}}};
const subs=[];const fire=()=>subs.forEach(f=>f());
// Password del Gestione: NON sta nel codice. Al primo accesso viene impostata dal gestore e
// salvata come hash SHA-256 con salt nel localStorage di questo dispositivo ('pwh').
// Non è autenticazione vera (il menù è pubblico e gira tutto nel browser): serve solo a
// impedire che chi apre il sorgente legga la password in chiaro.
const PWH_KEY='pwh';
async function sha256hex(str){
 const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
 return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function getPWH(){return ST.L(PWH_KEY,null)}
async function setPWH(pw){
 const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
 ST.S(PWH_KEY,{salt,hash:await sha256hex(salt+':'+pw)});
}
async function checkPWH(pw){
 const rec=getPWH();
 if(!rec||!rec.hash)return false;
 return await sha256hex(rec.salt+':'+pw)===rec.hash;
}
// Form di accesso condiviso da Gestione e Categorie.
// Primo accesso (nessuna password salvata) = la si imposta; altrimenti la si verifica.
function loginForm(title){
 const has=!!getPWH();
 $('#app').innerHTML='<main><h2 style="color:var(--gold)">'+esc(title)+'</h2><div class="item" style="display:block;cursor:default">'
  +(has?'<input id="pw" type="password" placeholder="Password">'
        :'<p class="note" style="text-align:left">Primo accesso: scegli la password del Gestione. Resta salvata solo su questo dispositivo.</p><input id="pw" type="password" placeholder="Nuova password"><input id="pw2" type="password" placeholder="Ripeti la password">')
  +'<div class="row"><button class="btn p" id="pk">'+(has?'Entra':'Imposta password')+'</button></div></div></main>';
 $('#pk').onclick=async()=>{
  const pw=$('#pw').value;
  if(!getPWH()){
   if(!pw||pw.length<6)return alert('La password deve avere almeno 6 caratteri.');
   if(pw!==$('#pw2').value)return alert('Le due password non coincidono.');
   await setPWH(pw);auth=true;render();return;
  }
  if(await checkPWH(pw)){auth=true;render()}else alert('Password errata.');
 };
}
let auth=false,authC=true; // cameriera senza password; admin con password
let authView=''; // vista in cui è stata fatta l'autenticazione: l'accesso vale finché si resta lì

// ---- Configurazione GitHub (per caricare menu.json automaticamente) ----
// Il token NON sta nel codice (GitHub lo bloccherebbe col secret scanner).
// Va inserito una volta sola in Gestione → "Token GitHub".
// Resta salvato nel localStorage del dispositivo admin.
const GH_TOKEN_KEY='ght';
function getGHToken(){return ST.L(GH_TOKEN_KEY,'')}
function setGHToken(t){ST.S(GH_TOKEN_KEY,t)}
const GH_OWNER='vignatefood';
const GH_REPO='al-peda';
const GH_BRANCH='main';
const GH_PATH='menu.json';
// URL predefinito del menu.json: GitHub Pages ha cache 10 min (vs jsdelivr 7gg, raw 5min)
// L'app aggiunge ?t=<timestamp> + cache:no-store per scavalcare la cache del browser
const DEFAULT_MENU_JSON_URL='https://vignatefood.github.io/al-peda/menu.json';
function initStore(){
 ST.menu=Object.fromEntries(SEED.map(i=>[i.id,i]));
 Object.assign(ST.menu,ST.L('pm',{}));
 Object.keys(ST.menu).forEach(k=>ST.menu[k].deleted&&delete ST.menu[k]);
 ST.url=ST.L('pu','');
 // URL del menu.json remoto: predefinito hardcoded (configurato), ma l'utente può cambiarlo in Gestione
 // Se 'rm' non è mai stato salvato, usa il default (così i clienti lo scaricano in automatico)
 ST.rurl=ST.L('rm','')||DEFAULT_MENU_JSON_URL;
 $('#sub').textContent='Ordina dal tuo tavolo';
 // Se c'è un menu.json remoto configurato, lo carica (async, non blocca il render)
 if(ST.rurl){loadRemoteMenu(false)}else{fire()}
}
function saveItem(it){ST.menu[it.id]=it;const m=ST.L('pm',{});m[it.id]=it;ST.S('pm',m);fire()}
function delItem(id){delete ST.menu[id];const m=ST.L('pm',{});m[id]={deleted:true};ST.S('pm',m);fire()}
function saveUrl(u){ST.url=u;ST.S('pu',u);fire()}
function saveRUrl(u){ST.rurl=u;ST.S('rm',u);fire()}
// Scarica menu.json dall'URL remoto e lo fonde col menù locale (SEED + override remoto + override locale)
async function loadRemoteMenu(force){
 if(!ST.rurl)return;
 const sub=$('#sub');
 const ts=ST.L('rv',0);
 // Cache-buster per beccare sempre l'ultima versione (GitHub Pages ha cache aggressiva)
 const u=ST.rurl.replace(/\?.*$/,'')+(ST.rurl.includes('?')?'&':'?')+'t='+Date.now();
 try{
  const r=await fetch(u,{cache:'no-store'});
  if(!r.ok){if(sub)sub.textContent='Menù remoto non raggiungibile ('+r.status+').';return false}
  const data=await r.json();
  if(!data||!data.items){if(sub)sub.textContent='Menu.json non valido.';return false}
  // Salva timestamp remoto e numero tavoli (se presente nel file remoto)
  ST.S('rv',data.ts||Date.now());
  if(data.nt)ST.S('nt',data.nt);
  // Fonde: SEED → remoto → locale (locale vince, così le modifiche fatte sul dispositivo non vengono perse)
  ST.menu=Object.fromEntries(SEED.map(i=>[i.id,i]));
  Object.assign(ST.menu,data.items||{});
  Object.assign(ST.menu,ST.L('pm',{}));
  Object.keys(ST.menu).forEach(k=>ST.menu[k].deleted&&delete ST.menu[k]);
  if(sub)sub.textContent='Ordina dal tuo tavolo';
  fire();
  return true;
 }catch(e){if(sub)sub.textContent='Errore di rete nel caricare il menù: '+e.message;return false}
}
// Esporta il menù corrente (SEED + override locale) come oggetto JSON pronto per il commit
function exportMenu(){
 const m={};
 Object.values(ST.menu).forEach(it=>{m[it.id]=it});
 return {version:2,ts:Date.now(),generated:new Date().toISOString(),nt:ST.L('nt',30),items:m};
}
// Importa un menu.json (sostituisce le modifiche locali)
function importMenu(data){
 if(!data||!data.items){alert('File non valido: manca items.');return false}
 const m={};
 Object.entries(data.items).forEach(([id,it])=>{if(it&&it.id)m[id]=it});
 ST.S('pm',m);
 if(data.nt)ST.S('nt',data.nt);
 ST.menu=Object.fromEntries(SEED.map(i=>[i.id,i]));
 Object.assign(ST.menu,m);
 Object.keys(ST.menu).forEach(k=>ST.menu[k].deleted&&delete ST.menu[k]);
 fire();
 return true;
}

// ---- Carica menu.json su GitHub automaticamente (PUT /repos/.../contents/menu.json) ----
// UTF-8 safe: converte stringa → base64 gestendo i caratteri multibyte (è, à, emoji, ecc.)
function strToBase64(str){
 const bytes=new TextEncoder().encode(str);
 let bin='';
 bytes.forEach(b=>bin+=String.fromCharCode(b));
 return btoa(bin);
}
async function pushMenuToGitHub(){
 const token=getGHToken();
 if(!token){alert('Token GitHub non configurato. Inseriscilo nel campo "Token GitHub" sotto, poi premi Salva token.');return false}
 const m=$('#rmp_status');
 const setStatus=s=>{if(m)m.textContent=s};
 setStatus('Caricamento in corso…');
 // 1) Verifica se menu.json esiste già, per recuperarne lo SHA (necessario per l'update)
 const apiUrl=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}`;
 let sha=null;
 try{
  const rGet=await fetch(apiUrl,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
  if(rGet.status===200){
   const dataGet=await rGet.json();
   sha=dataGet.sha;
   setStatus('File esistente trovato, aggiornamento…');
  }else if(rGet.status===404){
   setStatus('Creazione nuovo file menu.json…');
  }else{
   const err=await rGet.json().catch(()=>({}));
   setStatus('Errore verifica: '+(err.message||('HTTP '+rGet.status)));
   if(rGet.status===401||rGet.status===403)alert('Token non valido o senza permessi. Verifica il token e che abbia scope "Contents: Read and write" sul repo al-peda.');
   return false;
  }
 }catch(e){setStatus('Errore di rete: '+e.message);return false}
 // 2) Carica il nuovo contenuto (PUT)
 const payload=exportMenu();
 const content=strToBase64(JSON.stringify(payload,null,2));
 const body={message:'Aggiornamento menù del '+new Date().toLocaleString('it-IT'),content,branch:GH_BRANCH};
 if(sha)body.sha=sha;
 try{
  const rPut=await fetch(apiUrl,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  const dataPut=await rPut.json().catch(()=>({}));
  if(rPut.ok){
   ST.S('rv',payload.ts);
   setStatus('Menù pubblicato online! Aggiornamento in corso…');
   // Attendi 3s che GitHub propaghi il commit, poi ricarica il menù dal CDN
   setTimeout(async()=>{
    await loadRemoteMenu(true);
    // Pulisce pm locale dalle voci già pubblicate (identiche al remoto)
    // così il contatore "modifiche locali" va a 0 dopo un push riuscito
    const pm=ST.L('pm',{});
    const newPm={};
    Object.entries(pm).forEach(([id,pmIt])=>{
     const remoteIt=ST.menu[id];
     // Se l'item remoto esiste ed è identico a quello locale → già pubblicato, rimuovi da pm
     // Altrimenti mantieni (modifica non ancora sincronizzata o divergente)
     if(!remoteIt||JSON.stringify(remoteIt)!==JSON.stringify(pmIt)){
      newPm[id]=pmIt;
     }
    });
    ST.S('pm',newPm);
    const m2=$('#rmp_status');
    if(m2)m2.textContent='Menù pubblicato e ricaricato. I clienti vedranno le modifiche entro 10 minuti (cache GitHub Pages).';
    render();
   },3000);
   alert('Menù pubblicato con successo! L\'aggiornamento sarà visibile ai clienti entro 10 minuti (cache GitHub Pages).');
   return true;
  }else{
   setStatus('Errore upload: '+(dataPut.message||('HTTP '+rPut.status)));
   alert('Errore upload: '+(dataPut.message||('HTTP '+rPut.status)));
   return false;
  }
 }catch(e){setStatus('Errore upload: '+e.message);alert('Errore upload: '+e.message);return false}
}

// ---- Router
let cart=[],cat='',curSec='bar';const tavolo=()=>{const m=/^tavolo-(\d+)$/.exec(location.hash.slice(1));return m?m[1]:''};
// Restituisce la sezione di un piatto: 'bar', 'rist' o 'entrambi'. Retrocompatibile (usa CAT_SECS se manca .sec).
const itemSec=i=>i.sec||(CAT_SECS[i.cat]||'entrambi');
const view=()=>{const h=(location.hash||'#cliente').slice(1);return h.startsWith('tavolo-')?'cliente':h};
function render(){stopScan();const v=view();
 // L'accesso al Gestione dura finché si resta in una vista protetta: fire()/render() ridisegnano
 // la stessa vista e non devono buttare fuori (prima ogni salvataggio faceva auth=false).
 if(v!=='admin'&&v!=='categorie'){auth=false;authView=''}
 else if(authView!==v){auth=false;authView=v}
 $('#app').innerHTML='';
 const nav=`<div class="bottom-nav"><a class="btn" href="#cliente">Menù</a><a class="btn" href="#cameriera">Cameriera</a><a class="btn" href="#admin">Gestione</a><a class="btn" href="#categorie">Categorie</a></div>`;
 if(v==='admin')admin();else if(v==='categorie')categorie();else if(v==='cameriera')cameriera();else cliente();
 $('#app').insertAdjacentHTML('beforeend',nav);}
subs.push(render);addEventListener('hashchange',render);
// I segnaposto servono solo a ricordare la sezione di una categoria senza piatti:
// non sono piatti, non si contano e non si vedono.
const PLACEHOLDER_NAME='(segnaposto)';

// ---- QR dell'ordine (cliente) e lettura (cameriera)
const asc=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[^\x00-\x7F]/g,'');
function orderText(o){const tot=o.lines.reduce((s,l)=>s+l.unit*l.q,0);
 return asc('AL PEDA - TAVOLO '+o.t+(o.nm?' ('+o.nm+')':'')+'\n'+o.lines.map(l=>{const m=[...l.rem.map(r=>'senza '+r),...l.add.map(a=>'+ '+a),l.note].filter(Boolean);return l.q+'x '+l.n+(m.length?' - '+m.join(', '):'')}).join('\n')+(tot?'\nTOT EUR '+tot.toFixed(2).replace('.',','):''))}
function showOrdQR(o){const t=orderText(o);
 openSh('<h2 style="color:var(--gold);margin-top:0">Il tuo ordine 🍺</h2><p>Resta sul tuo telefono. Quando passa la cameriera, mostrale questo QR: lo inquadra e legge l’ordine.</p><div style="text-align:center"><div id="oq" style="background:#fff;padding:10px;display:inline-block"></div></div><pre style="white-space:pre-wrap;font:inherit;font-size:14px;margin:10px 0">'+esc(t)+'</pre><button class="btn p" onclick="closeSh()">Ok</button>');
 try{new QRCode($('#oq'),{text:t,width:280,height:280,correctLevel:QRCode.CorrectLevel.L})}catch(e){$('#oq').textContent='Ordine troppo lungo per il QR: mostra il testo alla cameriera.'}}
function lista(){return ST.L('lista',[])}
function addOrd(t){const l=lista(),m=$('#cm');if(l.includes(t)){if(m)m.textContent='Ordine già in lista.';return}l.push(t);ST.S('lista',l);if(m)m.textContent='Ordine aggiunto ✔ ('+l.length+' in lista)';drawLst()}
function drawLst(){const b=$('#lst');if(!b)return;const l=lista();b.innerHTML=l.length?l.map((t,k)=>'<div class="ord" style="margin:8px 0"><pre style="white-space:pre-wrap;font:inherit;margin:0">'+esc(t)+'</pre><div class="row"><button class="btn p" data-ev="'+k+'">Evaso</button></div></div>').join(''):'<p class="note">Nessun ordine in lista.</p>';
 b.querySelectorAll('[data-ev]').forEach(x=>x.onclick=()=>{const a=lista();a.splice(+x.dataset.ev,1);ST.S('lista',a);drawLst()})}
let cam=null,raf=0,scanBusy=false,scanTm=0;
function stopScan(){cancelAnimationFrame(raf);raf=0;clearTimeout(scanTm);if(cam){cam.getTracks().forEach(t=>t.stop());cam=null}const v=$('#vd');if(v){try{v.srcObject=null}catch(e){}}}
function cameriera(){
 $('#app').innerHTML='<main><h2 style="color:var(--gold)">Lettura ordine</h2><div class="item" style="display:block;cursor:default"><p class="note" id="cm">Inquadra il QR del cliente.</p><video id="vd" playsinline muted autoplay style="width:100%;border-radius:10px;background:#000"></video><div class="row"><button class="btn p" id="cs">Scansiona di nuovo</button><label class="btn">📷 Leggi da foto<input type="file" id="cf" accept="image/*" capture="environment" style="display:none"></label></div></div><h3 style="color:var(--gold)">Ordini ricevuti</h3><div id="lst"></div><div class="item" style="display:block;cursor:default"><span>Se la fotocamera non parte, incolla qui il testo:</span><textarea id="mt" rows="3"></textarea><div class="row"><button class="btn" id="ma">Aggiungi testo</button></div></div></main>';
 $('#cs').onclick=startScan;$('#cf').onchange=e=>{const f=e.target.files[0];if(!f)return;const m=$('#cm');m.textContent='Lettura in corso…';const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1200/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),r=typeof jsQR!=='undefined'?jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'}):null;if(r&&r.data){addOrd(r.data)}else{m.textContent='QR non trovato: riprova avvicinandoti, tenendo il QR ben dritto e ben illuminato (senza riflessi).';const ta=$('#mt');if(ta){ta.value='';ta.placeholder='Incolla qui il testo dell\'ordine come fallback…'}}URL.revokeObjectURL(im.src);e.target.value=''};im.onerror=()=>{m.textContent='Impossibile leggere la foto. Riprova o incolla il testo qui sotto.'};im.src=URL.createObjectURL(f)};$('#ma').onclick=()=>{const v=$('#mt').value.trim();if(v){addOrd(v);$('#mt').value=''}};drawLst();startScan()}
function startScan(){
 if(scanBusy){return}
 stopScan();
 const m=$('#cm');if(!m){scanBusy=false;return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){m.textContent='Errore: fotocamera non supportata. Apri l\'app su HTTPS (non su file://) oppure usa il campo testo qui sotto.';return}
 if(typeof jsQR==='undefined'||window.__jsQRFailed){m.textContent='Errore: lettore QR (jsQR) non caricato. Verifica la connessione internet, ricarica la pagina, oppure usa il campo testo qui sotto.';return}
 if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){m.textContent='Attenzione: la fotocamera richiede HTTPS. Apri l\'app dall\'indirizzo pubblico https://… ; nel frattempo puoi leggere da foto o incollare il testo qui sotto.';return}
 scanBusy=true;
 m.textContent='Avvio fotocamera…';
 const tryGet=(cons,fallback)=>{
  navigator.mediaDevices.getUserMedia(cons).then(s=>{
   const v=$('#vd');
   if(!v){s.getTracks().forEach(t=>t.stop());scanBusy=false;return}
   cam=s;v.srcObject=s;
   const ready=()=>{scanBusy=false;clearTimeout(scanTm);m.textContent='Inquadra il QR del cliente (puoi anche avvicinarti).';startLoop(v)};
   if(v.readyState>=2){ready()}else{v.onloadedmetadata=ready}
   v.play().catch(()=>{});
   scanTm=setTimeout(()=>{if(!cam){scanBusy=false;m.textContent='La fotocamera non risponde. Verifica i permessi, chiudi le altre app che la usano, oppure usa il campo testo qui sotto.'}},8000);
  }).catch(er=>{
   if(fallback){tryGet(fallback,null);return}
   scanBusy=false;
   const name=er&&er.name||'?';
   let msg='Errore fotocamera: '+name+(er&&er.message?' – '+er.message:'')+'. ';
   if(name==='NotAllowedError'||name==='PermissionDeniedError')msg+='Consenti l\'accesso alla fotocamera nelle impostazioni del browser. ';
   else if(name==='NotFoundError'||name==='DevicesNotFoundError')msg+='Nessuna fotocamera trovata sul dispositivo. ';
   else if(name==='NotReadableError'||name==='TrackStartError')msg+='La fotocamera è occupata da un\'altra app: chiudila e riprova. ';
   msg+='Nel frattempo puoi leggere da foto o incollare il testo qui sotto.';
   m.textContent=msg;
  });
 };
 tryGet({video:{facingMode:{ideal:'environment'}}},{video:true});
}
function startLoop(v){
 cancelAnimationFrame(raf);raf=0;
 const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
 const SW=480;
 (function loop(){
  if(!cam){return}
  if(v.videoWidth>0){
   const sc=SW/Math.max(v.videoWidth,v.videoHeight);
   c.width=Math.max(1,Math.round(v.videoWidth*sc));
   c.height=Math.max(1,Math.round(v.videoHeight*sc));
   x.drawImage(v,0,0,c.width,c.height);
   const d=x.getImageData(0,0,c.width,c.height);
   const r=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
   if(r&&r.data){
    addOrd(r.data);
    if(navigator.vibrate)navigator.vibrate(150);
    cancelAnimationFrame(raf);raf=0;
    setTimeout(()=>{if(cam&&$('#vd')===v){startLoop(v)}},1500);
    return;
   }
  }
  raf=requestAnimationFrame(loop);
 })();
}

// ---- Editor foto: riquadro quadrato fisso, tutte le foto escono 480x480
function cropFoto(im,done){const V=280;let z=1,ox=0,oy=0;
 const base=Math.max(V/im.width,V/im.height);
 const lim=()=>{const w=im.width*base*z,h=im.height*base*z;ox=Math.min(0,Math.max(V-w,ox));oy=Math.min(0,Math.max(V-h,oy))};
 const sh=document.createElement('div');sh.className='sheet show';sh.style.zIndex=40;
 sh.innerHTML='<div><h3 style="margin-top:0;color:var(--gold)">Sistema la foto</h3><p class="note">Trascina la foto e usa lo zoom: nel menù vedrai esattamente il quadrato qui sotto.</p><div style="text-align:center"><canvas id="cv" width="'+V+'" height="'+V+'" style="width:'+V+'px;height:'+V+'px;border:2px solid var(--gold);border-radius:8px;touch-action:none;background:#000"></canvas></div><input type="range" id="zm" min="1" max="4" step="0.01" value="1"><div class="row"><button class="btn p" id="cok" style="flex:1">Usa questa foto</button><button class="btn" id="cno">Annulla</button></div></div>';
 document.body.appendChild(sh);
 const cv=sh.querySelector('#cv'),x=cv.getContext('2d');
 const draw=()=>{lim();x.fillStyle='#000';x.fillRect(0,0,V,V);x.drawImage(im,ox,oy,im.width*base*z,im.height*base*z)};
 ox=(V-im.width*base)/2;oy=(V-im.height*base)/2;draw();
 let dr=null;
 cv.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!dr)return;ox=dr.ox+(e.clientX-dr.x);oy=dr.oy+(e.clientY-dr.y);draw()};
 cv.onpointerup=cv.onpointercancel=()=>{dr=null};
 sh.querySelector('#zm').oninput=e=>{const n=+e.target.value,c=V/2,k=n/z;ox=c-(c-ox)*k;oy=c-(c-oy)*k;z=n;draw()};
 sh.querySelector('#cno').onclick=()=>sh.remove();
 sh.querySelector('#cok').onclick=()=>{lim();const o=document.createElement('canvas');o.width=o.height=480;const k=480/V;
  o.getContext('2d').drawImage(im,ox*k,oy*k,im.width*base*z*k,im.height*base*z*k);done(o.toDataURL('image/jpeg',.8));sh.remove()}}

 $('#efcam').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>cropFoto(im,d=>{img=d;const p=$('#ep2');if(p){p.src=d;p.style.display='block'}const rb=$('#erf');if(rb){rb.style.display='inline-block'}});im.src=r.result};r.readAsDataURL(f);e.target.value=''};

// ---- Vista Gestione Categorie (separata, con rinomina ed eliminazione) ----
function categorie(){
 if(!auth){loginForm('Categorie');return}
 const allCats=[...new Set([...items().map(x=>x.cat)])];
 // Aggiungi le CATS iniziali solo se hanno piatti (se sono state rinominate/eliminate, non le mostriamo più)
 // Mantieni l'ordine di CATS seguito dalle categorie utente
 const catsOrdered=[...CATS.filter(c=>items().some(i=>i.cat===c)), ...items().map(i=>i.cat).filter(c=>!CATS.includes(c))];
 const allCatsOrdered=[...new Set(catsOrdered)];
 const catSec=c=>{const ps=items().filter(i=>i.cat===c);if(!ps.length)return CAT_SECS[c]||'entrambi';const secs=new Set(ps.map(itemSec));if(secs.size===1)return [...secs][0];return 'misto'};
 const secLabel=sec=>SECS.find(s=>s.id===sec)?.label||(sec==='entrambi'?'🔁 Entrambi':sec==='misto'?'🔀 Misto':'?');
 $('#app').innerHTML=`<main><h2 style="color:var(--gold)">Gestione categorie</h2>
 <p class="note">Qui puoi aggiungere, rinominare, cambiare sezione o eliminare qualsiasi categoria. Tutte le modifiche sono locali finché non fai "⬆ Salva online" dalla <a href="#admin">Gestione menù</a>.</p>
 <button class="btn p" id="addcat" style="width:100%;margin-bottom:10px">+ Aggiungi nuova categoria</button>
 ${allCatsOrdered.length?allCatsOrdered.map(c=>{const count=items().filter(i=>i.cat===c).length;const sec=catSec(c);const isDefault=CATS.includes(c);return `<div class="item" style="cursor:default;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
  <div style="flex:1;min-width:120px"><b class="catname" data-cat="${esc(c)}">${esc(c)}</b>${isDefault?' <small class="note">(iniziale)</small>':''}<br><span>${count} piatti · ${secLabel(sec)}</span></div>
  <select class="catsel" data-cat="${esc(c)}" style="width:auto;padding:4px 8px">
   ${SECS.map(s=>`<option value="${s.id}" ${sec===s.id?'selected':''}>${s.label}</option>`).join('')}
   <option value="entrambi" ${sec==='entrambi'||sec==='misto'?'selected':''}>🔁 Entrambi</option>
  </select>
  <button class="btn" data-rename="${esc(c)}" title="Rinomina">✏️</button>
  <button class="btn" data-rmcat="${esc(c)}" style="color:var(--red);border-color:var(--red)" title="Elimina">🗑</button>
 </div>`}).join(''):'<p class="note">Nessuna categoria. Clicca "+ Aggiungi nuova categoria" per crearne una.</p>'}
 <p class="note" style="margin-top:16px"><a class="btn" href="#admin">← Torna a Gestione menù</a></p></main>`;
 // Cambia sezione
 document.querySelectorAll('.catsel').forEach(sel=>sel.onchange=()=>{
  const c=sel.dataset.cat;const newSec=sel.value;
  const affected=items().filter(i=>i.cat===c);
  if(affected.length===0){
   // Nessun piatto: aggiorna CAT_SECS locale per quando verranno aggiunti
   // (non c'è modo di salvare CAT_SECS, ma il nuovo piatto erediterà la sec della categoria solo se ha piatti)
   // Quindi creiamo un segnaposto se la categoria è vuota e vogliamo forzare la sezione
   items().filter(i=>i.cat===c&&isPlaceholder(i)).forEach(i=>delItem(i.id));
   saveItem({id:'catsec_'+c+'_'+Date.now(),cat:c,sec:newSec,name:PLACEHOLDER_NAME,desc:'',prices:[['',0]],out:true,img:'',rem:[],add:[]});
   alert('Sezione di "'+c+'" impostata a '+secLabel(newSec)+'. La categoria era vuota: è stato creato un segnaposto (nascosto) per ricordare la sezione.');
   render();return;
  }
  affected.forEach(i=>{saveItem(Object.assign({},i,{sec:newSec}))});
  const span=sel.parentElement.querySelector('span');
  if(span)span.textContent=affected.length+' piatti · '+secLabel(newSec);
 });
 // Rinomina categoria
 document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{
  const c=b.dataset.rename;
  const n=prompt('Rinomina categoria "'+c+'" in:',c);
  if(!n||n.trim()===c)return;
  const nn=n.trim();
  if(allCatsOrdered.includes(nn)&&nn!==c)return alert('Esiste già una categoria con questo nome.');
  if(!confirm('Rinominare "'+c+'" in "'+nn+'"? Verranno aggiornati '+items().filter(i=>i.cat===c).length+' piatti.'))return;
  items().filter(i=>i.cat===c).forEach(i=>{saveItem(Object.assign({},i,{cat:nn}))});
  if(cat===c)cat=nn;
  alert('Categoria rinominata in "'+nn+'".');
  render();
 });
 // Elimina categoria
 document.querySelectorAll('[data-rmcat]').forEach(b=>b.onclick=()=>{
  const c=b.dataset.rmcat;
  const toMove=items().filter(i=>i.cat===c);
  if(toMove.length===0){
   if(!confirm('Eliminare la categoria vuota "'+c+'"?'))return;
   // Elimina eventuali segnaposto
   items().filter(i=>i.cat===c).forEach(i=>delItem(i.id));
   alert('Categoria "'+c+'" eliminata.');
   render();return;
  }
  const otherCats=allCatsOrdered.filter(x=>x!==c);
  if(otherCats.length===0){
   if(!confirm('Eliminare la categoria "'+c+'" con tutti i suoi '+toMove.length+' piatti? Non ci sono altre categorie dove spostarli. I piatti verranno eliminati definitivamente.'))return;
   toMove.forEach(i=>delItem(i.id));
   alert('Categoria "'+c+'" e '+toMove.length+' piatti eliminati.');
   render();return;
  }
  // Mostra sheet con scelta destinazione
  openSh(`<h3 style="margin-top:0;color:var(--gold)">Elimina "${esc(c)}"</h3>
  <p class="note" style="text-align:left">${toMove.length} piatti sono in questa categoria. Scegli dove spostarli:</p>
  <select id="mvdest">
   ${otherCats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
   <option value="__new__">+ Crea nuova categoria…</option>
   <option value="__del__">🗑 Elimina anche i piatti</option>
  </select>
  <input id="mvnew" placeholder="Nome nuova categoria" style="display:none">
  <p class="note" style="text-align:left;margin-top:10px">Cambiare sezione dei piatti spostati?</p>
  <select id="mvsec">
   <option value="__keep__">🔁 Mantieni sezione attuale</option>
   ${SECS.map(s=>`<option value="${s.id}">Forza ${s.label}</option>`).join('')}
   <option value="entrambi">Forza 🔁 Entrambi</option>
  </select>
  <div class="row"><button class="btn p" id="mvok" style="flex:1">Conferma</button><button class="btn" id="mvcancel">Annulla</button></div>`);
  $('#mvdest').onchange=e=>$('#mvnew').style.display=e.target.value==='__new__'?'block':'none';
  $('#mvcancel').onclick=closeSh;
  $('#mvok').onclick=()=>{
   const dest=$('#mvdest').value;
   const newSec=$('#mvsec').value;
   if(dest==='__del__'){
    if(!confirm('Confermi: eliminare la categoria "'+c+'" E '+toMove.length+' piatti? Operazione irreversibile.'))return;
    toMove.forEach(i=>delItem(i.id));
    alert('Categoria "'+c+'" e '+toMove.length+' piatti eliminati.');
   }else{
    let d=dest;
    if(dest==='__new__'){
     d=$('#mvnew').value.trim();
     if(!d){alert('Inserisci il nome della nuova categoria.');return}
    }
    toMove.forEach(i=>{
     const upd=Object.assign({},i,{cat:d});
     if(newSec!=='__keep__')upd.sec=newSec;
     saveItem(upd);
    });
    // Elimina segnaposto se la categoria era vuota + segnaposto
    items().filter(i=>i.cat===c&&isPlaceholder(i)).forEach(i=>delItem(i.id));
    if(cat===c)cat=d;
    alert('Categoria "'+c+'" eliminata. I '+toMove.length+' piatti sono ora in "'+d+'".');
   }
   closeSh();render();
  };
 });
 // Aggiungi nuova categoria
 $('#addcat').onclick=()=>{
  openSh(`<h3 style="margin-top:0;color:var(--gold)">Aggiungi categoria</h3>
  <input id="newcat" placeholder="Nome categoria (es. Panini, Dolci)">
  <select id="newcatsec">
   ${SECS.map(s=>`<option value="${s.id}">${s.label}</option>`).join('')}
   <option value="entrambi">🔁 Entrambi</option>
  </select>
  <div class="row"><button class="btn p" id="oknewcat" style="flex:1">Aggiungi</button><button class="btn" id="cancelnewcat">Annulla</button></div>`);
  $('#cancelnewcat').onclick=closeSh;
  $('#oknewcat').onclick=()=>{
   const n=$('#newcat').value.trim();
   if(!n){alert('Inserisci un nome.');return}
   if(allCatsOrdered.includes(n)){alert('Categoria già esistente.');return}
   const s=$('#newcatsec').value;
   // Crea un segnaposto invisibile che definisce la categoria (con sezione)
   saveItem({id:'cat_'+Date.now(),cat:n,sec:s||'entrambi',name:'(categoria nuova)',desc:'',prices:[['',0]],out:true,img:'',rem:[],add:[]});
   alert('Categoria "'+n+'" aggiunta. Ora puoi usarla quando modifichi un piatto (sarà nascosta finché non aggiungi piatti).');
   closeSh();render();
  };
 };
}

function editCats(){location.hash='#categorie'}
// Auto-pulizia quando il cliente chiude il tab (pagehide): cancella l'ultimo ordine salvato
// per privacy. Il carrello (cart) è in memoria e si perde già chiudendo.
// NON tocchiamo: token GitHub, lista ordini cameriera, pm (modifiche admin), configurazione.
addEventListener('pagehide',()=>{
 if(view()==='cliente'){
  // Solo se è la vista cliente: pulisce l'ultimo ordine mostrato
  // (lo mantiene invece se è admin o cameriera)
  // Disabilitato di default — scommenta le righe sotto per attivare la pulizia automatica
  // localStorage.removeItem('ult');
 }
});
// ---- Refresh automatico con cache-buster (una volta per sessione browser) ----
// Obbliga il browser a scaricare la versione fresca di index.html da GitHub Pages,
// ignorando la cache HTTP (max 10 min). sessionStorage si resetta chiudendo il tab,
// così al prossimo accesso rifà il refresh. Niente loop infiniti.
if(!sessionStorage.getItem('_freshLoaded') && !location.search.includes('nocache=')){
 sessionStorage.setItem('_freshLoaded','1');
 // location.replace NON aggiunge una voce alla cronologia: l'utente non se ne accorge
 const freshUrl=location.pathname+'?nocache='+Date.now()+location.hash;
 location.replace(freshUrl);
}else{
 // Marca la sessione come "fresca" anche se l'URL aveva già nocache (es. dal pulsante Svuota cache)
 sessionStorage.setItem('_freshLoaded','1');
 initStore();render();
}
